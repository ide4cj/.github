name: cjls
description: >
  The cjls binary for this runner, for a client's tests (cjls's D32): when cjls has a branch named like
  this run's, the build its CI made of that branch's head, waited for while it runs, and the step fails
  when that run failed or there is none (after the branch's merge, its newest run); else the release
  `version` names — a tag (`nightly-build` too), or empty for the latest. `path` is empty, with a notice,
  when there is no such release.

inputs:
  version:
    description: A release tag (the client's pin) or `nightly-build`, or empty for the latest release
    required: false
    default: ""
  branch:
    description: The cjls branch whose build to take first; this run's own branch by default, none on a default branch
    required: false
    default: ${{ github.head_ref || (github.ref_name != github.event.repository.default_branch && github.ref_name) || '' }}
  releases:
    description: "`false`: the paired branch's build alone, `path` empty without one, for a client that downloads releases by its own installer"
    required: false
    default: "true"
  token:
    description: A token that reads ide4cj/cjls's runs and releases
    required: false
    default: ${{ github.token }}

outputs:
  path:
    description: The binary, or empty
    value: ${{ steps.get.outputs.path }}
  source:
    description: Which build it is
    value: ${{ steps.get.outputs.source }}

runs:
  using: composite
  steps:
    - id: get
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
        RELEASES: ${{ inputs.releases }}
      run: |
        case "$RUNNER_OS" in
          macOS) target=aarch64-apple-darwin; format=tar.gz; exe=cjls ;;
          Linux) target=x86_64-unknown-linux-gnu; format=tar.gz; exe=cjls ;;
          Windows) target=x86_64-pc-windows-gnu; format=zip; exe=cjls.exe ;;
        esac
        dir="$RUNNER_TEMP/cjls-bin"
        mkdir -p "$dir"
        source=""
        if [ -n "$BRANCH" ] && [ "$BRANCH" != master ]; then
          # a pair is tested against its head's build or fails here, never a release or an older build
          # forward slashes: Git Bash on Windows reads D:/a/..., the runner gives D:\a\...
          run=$(bash "${GITHUB_ACTION_PATH//\\//}/paired-run.sh" "$BRANCH")
          if [ -n "$run" ]; then
            if ! gh run download "$run" --repo ide4cj/cjls --name "cjls-$RUNNER_OS" --dir "$dir"; then
              echo "::error::no cjls-$RUNNER_OS in https://github.com/ide4cj/cjls/actions/runs/$run"
              exit 1
            fi
            source="ide4cj/cjls@$BRANCH, CI run $run"
          fi
        fi
        if [ -z "$source" ] && [ "$RELEASES" = false ]; then
          echo "path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -z "$source" ]; then
          # bsdtar reads zip; Git Bash's GNU tar, first on PATH on Windows, does not
          tar=tar
          if [ "$RUNNER_OS" = Windows ]; then tar="$SYSTEMROOT/System32/tar.exe"; fi
          if gh release download ${VERSION:+"$VERSION"} --repo ide4cj/cjls --pattern "cjls-$target.$format" --dir "$RUNNER_TEMP" --clobber; then
            (cd "$RUNNER_TEMP" && "$tar" -xf "cjls-$target.$format")
            mv "$RUNNER_TEMP/cjls-$target/$exe" "$dir/$exe"
            source="ide4cj/cjls release ${VERSION:-latest}"
          else
            echo "::notice::no cjls release ${VERSION:-yet}: the server is not tested"
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        chmod +x "$dir/$exe"
        echo "::notice::cjls: $source"
        echo "path=$dir/$exe" >> "$GITHUB_OUTPUT"
        echo "source=$source" >> "$GITHUB_OUTPUT"
