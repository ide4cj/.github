name: Project

# Every open issue of the organization onto its board, with the organization's app (its token
# reaches the board and every repository; GITHUB_TOKEN neither)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    name: Add issues to the board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: vars.RELEASE_APP_ID == ''
        run: |
          echo "::notice::the organization's app is not installed yet (RELEASE_APP_ID): run scripts/add_to_project.py by hand"
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - if: steps.app.outputs.token
        uses: actions/checkout@v4
      - if: steps.app.outputs.token
        uses: astral-sh/setup-uv@v6
      - if: steps.app.outputs.token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run scripts/add_to_project.py
